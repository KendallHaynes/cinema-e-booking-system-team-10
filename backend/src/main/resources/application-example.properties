spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinema_db_schema}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail-from=${APP_MAIL_FROM:noreply@cinema.local}
app.card-encryption-key=${PAYMENT_CARD_ENCRYPTION_KEY:}
app.demo-seed.enabled=${DEMO_SEED_ENABLED:false}
app.demo-seed.password=${DEMO_SEED_PASSWORD:}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
