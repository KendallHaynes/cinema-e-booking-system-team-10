spring.datasource.url=jdbc:mysql://localhost:3306/cinema_db
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail-from=${APP_MAIL_FROM:noreply@cinema.local}
app.card-encryption-key=${PAYMENT_CARD_ENCRYPTION_KEY:}
app.demo-seed.enabled=${DEMO_SEED_ENABLED:false}
app.demo-seed.password=${DEMO_SEED_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
